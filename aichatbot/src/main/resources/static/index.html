
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
        }

        #chat {
            background: white;
            height: 430px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin: 20px 0;
        }

        .message {
            padding: 12px 15px;
            margin: 12px 0;
            border-radius: 10px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #dbeafe;
            margin-left: 15%;
        }

        .bot {
            background: #f1f5f9;
            margin-right: 10%;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            min-height: 24px;
            color: #64748b;
            margin-top: 10px;
        }

        @media (max-width: 500px) {
            .container {
                margin: 10px auto;
                padding: 12px;
            }

            .input-area {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Java AI Chatbot</h1>
        <p class="subtitle">
            Powered by Java 21, Spring Boot and AI
        </p>

        <div id="chat" aria-live="polite">
            <div class="message bot">
                Hello! I am your AI assistant.
                What would you like to know?
            </div>
        </div>

        <form id="chatForm" class="input-area">
            <input
                id="message"
                type="text"
                placeholder="Ask me anything..."
                maxlength="4000"
                autocomplete="off"
                required
            >
            <button id="sendButton" type="submit">
                Send
            </button>
        </form>

        <div id="status" role="status"></div>
    </main>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("chatForm");
        const input = document.getElementById("message");
        const button = document.getElementById("sendButton");
        const status = document.getElementById("status");

        function addMessage(sender, text, type) {
            const message = document.createElement("div");
            message.className = "message " + type;

            // Use textContent to avoid interpreting AI output as HTML.
            message.textContent = sender + ": " + text;

            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
            return message;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = input.value.trim();

            if (!message || button.disabled) {
                return;
            }

            addMessage("You", message, "user");

            input.value = "";
            button.disabled = true;
            status.textContent = "AI is thinking...";

            const loading = addMessage(
                "AI", "Generating response...", "bot"
            );

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || "Request failed"
                    );
                }

                loading.textContent = "AI: " + data.reply;
                status.textContent = "Response received.";

            } catch (error) {
                loading.textContent =
                    "AI: Sorry, " + error.message;
                status.textContent = "Request failed.";
            } finally {
                button.disabled = false;
                input.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        });
    </script>
</body>
</html>
